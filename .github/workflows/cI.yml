name: CI

on:
  push:
    branches:
      - main
      - develop
      - release
  pull_request:
    branches:
      - main
      - develop
      - release

jobs:
  code-style:
    runs-on: ubuntu-latest

    steps:
    - name: Display user information
      run: |
        echo "Name: Ivanov Ivan"
        echo "Group: 12345"
        echo "GitHub Username: ${{ github.actor }}"

    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python 3.13
      uses: actions/setup-python@v2
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black

    - name: Run Black code style check
      run: |
        black --check --diff .

    - name: Run tests with pytest
      run: |
        pip install pytest
        pytest tests/

    - name: Check code style with flake8
      run: |
        pip install flake8
        flake8 --max-line-length=79 .

    - name: Display result
      run: echo "Code style check and tests completed"

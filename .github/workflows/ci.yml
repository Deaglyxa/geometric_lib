name: CI

on:
  push:
    branches:
      - main
      - release/*
      - develop
  pull_request:
    branches:
      - master
      - release/*
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Output information
        run: |
          echo "Full Name: Konstantin Stakhurskiy"
          echo "Group: M3114"
          echo "GitHub username: ${{ github.actor }}"

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Check current directory
        run: ls -alh  

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: C:\Users\kos18\geometric_lib

      - name: Run tests
        run: |
          pytest  

      - name: Lint code with flake8
        run: |
          pip install flake8
          flake8 geometric_lib tests
